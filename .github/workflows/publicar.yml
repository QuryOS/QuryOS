name: Publicar QuriOS

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir
        run: |
          ZIP=$(ls -t *.zip | head -n 1)
          echo "Usando: $ZIP"
          unzip -q -o "$ZIP" -d site
          rm -f site/LEEME.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
